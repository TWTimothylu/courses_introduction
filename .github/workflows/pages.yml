name: Deploy course website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare public website
        run: |
          mkdir _site
          cp -r dist/assets _site/assets
          cp dist/index.html dist/style.css dist/app.js dist/trial.html dist/trial.css dist/trial.js dist/course-*.html dist/course.css dist/course.js dist/media.css dist/media.js _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
